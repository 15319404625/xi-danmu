<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汐 - 弹幕视频社区</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pink:#FB7299;--blue:#00AEEC;--bg:#f6f7f8;--card:#fff;--text:#18191c;--sub:#61666d}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;font-family:inherit}
input,textarea,select{font-family:inherit;outline:none}

/* nav */
.nav{position:sticky;top:0;z-index:100;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;align-items:center;padding:0 24px;height:56px;gap:20px}
.logo{font-size:26px;font-weight:900;color:var(--pink);cursor:pointer}
.nav .search{flex:1;max-width:400px;display:flex;background:#f1f2f3;border-radius:8px;overflow:hidden}
.nav .search input{flex:1;border:none;background:transparent;padding:8px 12px;font-size:14px}
.nav .search button{background:transparent;padding:0 14px;color:#61666d}
.nav .right{display:flex;align-items:center;gap:14px;margin-left:auto}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.btn{padding:7px 16px;border-radius:8px;font-size:14px}
.btn-pink{background:var(--pink);color:#fff}
.btn-ghost{background:#f1f2f3}
.btn-blue{background:var(--blue);color:#fff}
.upload-btn{background:var(--pink);color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px;display:flex;align-items:center;justify-content:center}

/* categories */
.cats{background:#fff;display:flex;gap:22px;padding:0 24px;height:44px;align-items:center;overflow-x:auto;border-bottom:1px solid #f1f2f3}
.cats span{white-space:nowrap;color:#61666d;font-size:14px;cursor:pointer;padding:4px 0}
.cats span.active{color:var(--pink);font-weight:700}

/* banner */
.banner{margin:16px 24px;border-radius:12px;background:linear-gradient(120deg,#FB7299,#00AEEC);color:#fff;padding:36px 32px}
.banner h1{font-size:34px;margin-bottom:8px}
.banner p{opacity:.9}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding:16px 24px}
.card{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card .thumb{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.card .thumb img,.card .thumb video{width:100%;height:100%;object-fit:cover}
.card .thumb .playico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px}
.card .stats{position:absolute;left:6px;bottom:6px;right:6px;display:flex;justify-content:space-between;color:#fff;font-size:12px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.card .body{padding:8px 10px}
.card .title{font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12px;color:var(--sub);margin-top:4px}
.tag-type{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:#e3f2fd;color:var(--blue);margin-right:4px}

/* work detail */
.detail{max-width:1000px;margin:16px auto;padding:0 16px}
.player-wrap{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9}
.player-wrap video{width:100%;height:100%;object-fit:contain}
.danmu-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.danmu-item{position:absolute;white-space:nowrap;font-size:20px;text-shadow:0 1px 2px #000;display:flex;align-items:center;gap:6px;will-change:transform}
.danmu-item img{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1px solid #fff}
.danmu-item .dn-name{font-size:12px;opacity:.85}
.rainbow-text{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rain 3s linear infinite}
@keyframes rain{to{background-position:200% center}}
.post-view{background:#fff;border-radius:12px;padding:30px;min-height:200px}
.post-view h1{font-size:24px;margin-bottom:16px}
.post-view .text{font-size:16px;line-height:1.8;white-space:pre-wrap}
.post-view img{max-width:100%;border-radius:8px;margin-top:12px}

.info-row{display:flex;align-items:center;gap:16px;background:#fff;border-radius:12px;padding:14px 18px;margin-top:14px}
.act-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:18px;background:#f1f2f3;font-size:14px;color:#61666d}
.act-btn.on{background:#ffeef3;color:var(--pink)}
.act-btn.liked{background:#ffeef3;color:var(--pink)}
.upinfo{display:flex;align-items:center;gap:10px;margin-left:auto}

/* danmu bar */
.danmu-bar{background:#fff;border-radius:12px;padding:12px 16px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.danmu-bar .row1{display:flex;gap:10px;align-items:center}
.danmu-bar input{flex:1;border:1px solid #e3e5e7;border-radius:8px;padding:9px 12px;font-size:14px}
.colors{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.swatch.sel{border-color:#000}
.swatch.locked{opacity:.4;cursor:not-allowed;position:relative}

/* comments */
.comments{background:#fff;border-radius:12px;padding:18px;margin-top:14px}
.comments h3{margin-bottom:12px}
.cmt-input{display:flex;gap:10px;margin-bottom:18px}
.cmt-input input{flex:1;border:1px solid #e3e5e7;border-radius:8px;padding:9px 12px}
.cmt{display:flex;gap:10px;padding:12px 0;border-top:1px solid #f1f2f3}
.cmt .body{flex:1}
.cmt .name{font-size:13px;color:var(--sub)}
.cmt .txt{font-size:15px;margin:4px 0}
.cmt .foot{font-size:12px;color:var(--sub);display:flex;gap:14px;align-items:center}
.cmt .foot span{cursor:pointer}
.replies{margin-left:36px;border-left:2px solid #f1f2f3;padding-left:12px}
.reply-box{margin:6px 0}
.reply-box input{width:100%;border:1px solid #e3e5e7;border-radius:6px;padding:6px 10px;font-size:13px}

/* modal */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center}
.mask.show{display:flex}
.modal{background:#fff;border-radius:14px;width:480px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:24px}
.modal h2{margin-bottom:16px}
.modal label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.modal input,.modal textarea,.modal select{width:100%;border:1px solid #e3e5e7;border-radius:8px;padding:9px 12px;font-size:14px}
.modal textarea{min-height:80px;resize:vertical}
.modal .typepick{display:flex;gap:10px;margin-bottom:10px}
.modal .typepick div{flex:1;border:2px solid #e3e5e7;border-radius:10px;padding:16px;text-align:center;cursor:pointer}
.modal .typepick div.sel{border-color:var(--pink);background:#fff0f5}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

/* panel pages */
.page{max-width:1000px;margin:16px auto;padding:0 16px;display:none}
.page.show{display:block}
.tabs{display:flex;gap:18px;border-bottom:1px solid #e3e5e7;margin-bottom:16px}
.tabs span{padding:10px 4px;cursor:pointer;color:var(--sub)}
.tabs span.active{color:var(--pink);border-bottom:2px solid var(--pink);font-weight:700}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #f1f2f3;font-size:14px}
th{background:#fafbfc;color:var(--sub);font-weight:500}
.mini{padding:3px 10px;border-radius:6px;font-size:12px;background:#f1f2f3;cursor:pointer}
.mini.danger{background:#ffeef3;color:var(--pink)}
.mini.pink{background:var(--pink);color:#fff}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:8px;z-index:300;display:none;font-size:14px}
.empty{text-align:center;color:var(--sub);padding:40px}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}.nav{padding:0 12px}.banner{margin:12px}.detail{padding:0 8px}}
</style>
</head>
<body>

<div class="nav">
  <div class="logo" onclick="go('home')">汐</div>
  <div class="search"><input id="searchInput" placeholder="搜索视频、UP主"><button onclick="doSearch()">搜索</button></div>
  <div class="right">
    <button class="upload-btn" title="上传" onclick="openUpload()">+</button>
    <div id="navUser"></div>
  </div>
</div>

<div class="cats" id="cats"></div>

<!-- HOME -->
<div class="page show" id="page-home">
  <div class="banner"><h1>欢迎来到汐</h1><p>用弹幕连接世界 · 动画 / 游戏 / 知识 / 生活</p></div>
  <div class="grid" id="homeGrid"></div>
</div>

<!-- DETAIL -->
<div class="page" id="page-detail"></div>

<!-- PROFILE -->
<div class="page" id="page-profile"></div>

<!-- ADMIN -->
<div class="page" id="page-admin"></div>

<!-- MODALS -->
<div class="mask" id="mask">
  <div class="modal" id="modalBox"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const CATS=[['all','全部'],['animation','动画'],['bangumi','番剧'],['game','游戏'],['knowledge','知识'],['tech','科技'],['music','音乐'],['dance','舞蹈'],['film','影视'],['life','生活'],['guichu','鬼畜'],['fashion','时尚'],['ent','娱乐'],['sports','运动']];
const COLORS=[['white','#fff','白色(默认)'],['red','#f00','红色'],['yellow','#ff0','黄色'],['blue','#0080ff','蓝色'],['green','#0c0','绿色'],['cyan','#0ff','青色'],['purple','#a0f','紫色'],['rainbow','rainbow','渐变彩(LV3+)']];
let me=null, token=localStorage.getItem('xi_token')||null;
let curWork=null, es=null, selColor='white', activeCat='all';

// ---------- helpers ----------
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2200);}
function api(path,opts={}){opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});if(token)opts.headers.Authorization='Bearer '+token;return fetch(path,opts).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('请求失败 '+r.status));return j;});}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('show'));document.getElementById('page-'+p).classList.add('show');window.scrollTo(0,0);}
function fmtTime(t){const d=new Date(t);return d.getMonth()+1+'月'+d.getDate()+'日';}

// ---------- auth ----------
function refreshMe(){return api('/api/auth/me').then(j=>{me=j.user;renderNav();}).catch(()=>{me=null;renderNav();});}
function renderNav(){
  const el=document.getElementById('navUser');
  if(me){
    el.innerHTML=`<div class="avatar" onclick="openMenu()">${me.avatar?`<img src="${me.avatar}">`:esc(me.name[0])}</div>
      <span style="font-size:13px">LV${me.level}</span>`;
  } else {
    el.innerHTML=`<button class="btn btn-ghost" onclick="openLogin(false)">登录</button><button class="btn btn-pink" onclick="openLogin(true)">注册</button>`;
  }
}
function openMenu(){
  const items=[['我的主页',()=>openProfile()],['观看历史',()=>openHistory()],['发布我的作品',()=>openUpload()]];
  if(me.isAdmin)items.push(['管理后台',()=>openAdmin()]);
  items.push(['退出登录',()=>{localStorage.removeItem('xi_token');token=null;me=null;renderNav();go('home');loadHome();}]);
  openModal(`<h2>${esc(me.name)} · LV${me.level}</h2>`+items.map(([t,f],i)=>`<div style="padding:12px;border-bottom:1px solid #f1f2f3;cursor:pointer" onclick="closeModal();_m[${i}]()">${t}</div>`).join(''));
  window._m=items.map(x=>x[1]);
}

// ---------- auth modal ----------
function openLogin(isReg){
  openModal(`<h2>${isReg?'注册':'登录'}</h2>
    <label>用户名</label><input id="auName">
    <label>密码</label><input id="auPass" type="password">
    <div class="actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button>
    <button class="btn btn-pink" onclick="doLogin(${isReg})">${isReg?'注册':'登录'}</button></div>`);
}
function doLogin(isReg){
  const name=document.getElementById('auName').value.trim(),pass=document.getElementById('auPass').value;
  api(isReg?'/api/register':'/api/login',{method:'POST',body:JSON.stringify({name,pass})}).then(j=>{
    token=j.token;localStorage.setItem('xi_token',token);closeModal();refreshMe();toast(isReg?'注册成功':'登录成功');loadHome();
  }).catch(e=>toast(e.message));
}

// ---------- home ----------
function loadCats(){
  document.getElementById('cats').innerHTML=CATS.map(([v,n])=>`<span class="${v===activeCat?'active':''}" onclick="activeCat='${v}';loadCats();loadHome()">${n}</span>`).join('');
}
function loadHome(){
  loadCats();
  api('/api/works?category='+activeCat).then(list=>{
    document.getElementById('homeGrid').innerHTML=list.length?list.map(card).join(''):'<div class="empty">暂无内容，快来发布第一条</div>';
  });
}
function card(w){
  const thumb=w.type==='video'
    ? (w.coverUrl?`<img src="${w.coverUrl}">`:(w.videoUrl?`<video src="${w.videoUrl}" muted></video>`:`<div class="playico">▶</div>`))
    : (w.images&&w.images.length?`<img src="${w.images[0]}">`:`<div class="playico" style="font-size:24px">文</div>`);
  return `<div class="card" onclick="openWork(${w.id})">
    <div class="thumb">${thumb}
      <div class="stats"><span>▶ ${w.playCount}</span><span>💬 ${w.danmuCount}</span></div>
    </div>
    <div class="body"><div class="title"><span class="tag-type">${w.type==='video'?'视频':'图文'}</span>${esc(w.title)}</div>
    <div class="meta">${esc(w.authorName)} · ${w.likeCount}赞 · ${fmtTime(w.createdAt)}</div></div></div>`;
}
function doSearch(){toast('搜索：'+document.getElementById('searchInput').value);}

// ---------- upload ----------
function openUpload(){
  if(!me)return openLogin(false);
  openModal(`<h2>发布作品</h2>
    <div class="typepick">
      <div id="tp-video" onclick="pickType('video')"><b>视频投稿</b><br><small>上传视频文件</small></div>
      <div id="tp-post" onclick="pickType('post')"><b>图文投稿</b><br><small>文字+图片</small></div>
    </div>
    <label>标题</label><input id="upTitle">
    <label>简介/正文</label><textarea id="upContent"></textarea>
    <label>分区</label><select id="upCat">${CATS.filter(c=>c[0]!=='all').map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select>
    <div id="videoFields">
      <label>视频文件(mp4)</label><input type="file" id="upVideo" accept="video/*">
      <label>封面图</label><input type="file" id="upCover" accept="image/*">
    </div>
    <div id="postFields" style="display:none">
      <label>图片(可多选)</label><input type="file" id="upImages" accept="image/*" multiple>
    </div>
    <div class="actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button>
    <button class="btn btn-pink" onclick="doUpload()">发布</button></div>`);
  window._utype='video';pickType('video');
}
function pickType(t){
  window._utype=t;
  document.getElementById('tp-video').classList.toggle('sel',t==='video');
  document.getElementById('tp-post').classList.toggle('sel',t==='post');
  document.getElementById('videoFields').style.display=t==='video'?'block':'none';
  document.getElementById('postFields').style.display=t==='post'?'block':'none';
}
function doUpload(){
  const fd=new FormData();
  fd.append('type',window._utype);
  fd.append('title',document.getElementById('upTitle').value);
  fd.append('content',document.getElementById('upContent').value);
  fd.append('category',document.getElementById('upCat').value);
  if(window._utype==='video'){
    const v=document.getElementById('upVideo').files[0];if(v)fd.append('video',v);
    const c=document.getElementById('upCover').files[0];if(c)fd.append('cover',c);
  } else {
    [...document.getElementById('upImages').files].forEach(f=>fd.append('images',f));
  }
  fetch('/api/works',{method:'POST',headers:token?{Authorization:'Bearer '+token}:{}},body:fd).then(r=>r.json()).then(j=>{
    if(j.error)return toast(j.error);closeModal();toast('发布成功');loadHome();go('home');
  }).catch(e=>toast(e.message));
}

// ---------- detail ----------
function openWork(id){
  api('/api/works/'+id).then(w=>{
    curWork=w;renderDetail(w);go('detail');connectDanmu(w.id);loadComments(w.id);
  }).catch(e=>toast(e.message));
}
function renderDetail(w){
  const d=document.getElementById('page-detail');
  let player='';
  if(w.type==='video'){
    player=`<div class="player-wrap"><video id="player" src="${w.videoUrl}" controls autoplay></video><div class="danmu-layer" id="danmuLayer"></div></div>`;
  } else {
    player=`<div class="post-view"><h1>${esc(w.title)}</h1><div class="text">${esc(w.content)}</div>${(w.images||[]).map(i=>`<img src="${i}">`).join('')}<div class="danmu-layer" id="danmuLayer" style="position:absolute;pointer-events:none"></div></div>`;
  }
  d.innerHTML=`
    <div class="detail">
      ${player}
      <div class="info-row">
        <div class="avatar">${esc(w.authorName[0])}</div>
        <div><div style="font-weight:700">${esc(w.authorName)}</div><div style="font-size:12px;color:var(--sub)">${w.type==='video'?'视频':'图文'} · ${w.playCount}播放</div></div>
        <div class="upinfo">
          <button class="act-btn" id="btnLike" onclick="act('like')">👍 <span id="cLike">${w.likeCount}</span></button>
          <button class="act-btn" id="btnCoin" onclick="act('coin')">🪙 <span id="cCoin">${w.coinCount}</span></button>
          <button class="act-btn" id="btnFav" onclick="act('fav')">⭐ <span id="cFav">${w.favCount}</span></button>
          <button class="act-btn" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href);toast('链接已复制')">🔗 分享</button>
        </div>
      </div>
      <div class="danmu-bar">
        <div class="row1">
          <input id="dmInput" placeholder="发个友善的弹幕见证当下" onkeydown="if(event.key==='Enter')sendDanmu()">
          <button class="btn btn-pink" onclick="sendDanmu()">发送</button>
        </div>
        <div class="colors" id="colorRow"></div>
      </div>
      <div class="comments" id="commentBox">
        <h3>评论 <span id="cmtCount">${w.commentCount}</span></h3>
        <div class="cmt-input">
          <input id="cmtInput" placeholder="发一条友善的评论">
          <button class="btn btn-pink" onclick="sendComment(null)">评论</button>
        </div>
        <div id="cmtList"></div>
      </div>
    </div>`;
  renderColors();
}
function renderColors(){
  document.getElementById('colorRow').innerHTML='<span style="font-size:13px">颜色:</span>'+COLORS.map(([v,hex,label])=>{
    const locked=v==='rainbow'&&(!me||me.level<3);
    return `<div class="swatch ${v===selColor?'sel':''} ${locked?'locked':''}" title="${label}" data-v="${v}" style="background:${hex==='rainbow'?'linear-gradient(90deg,red,yellow,green,cyan,blue,purple)':hex}" onclick="pickColor('${v}',${locked})"></div>`;
  }).join('');
  document.querySelectorAll('.swatch').forEach(s=>s.onclick=()=>pickColor(s.dataset.v,s.classList.contains('locked')));
}
function pickColor(v,locked){
  if(locked)return toast('渐变彩色需要 LV3 及以上等级解锁');
  selColor=v;renderColors();
}
function act(a){
  if(!me)return openLogin(false);
  api(`/api/works/${curWork.id}/act`,{method:'POST',body:JSON.stringify({action:a})}).then(j=>{
    document.getElementById('cLike').textContent=j.likeCount;
    document.getElementById('cCoin').textContent=j.coinCount;
    document.getElementById('cFav').textContent=j.favCount;
    if(a==='like')document.getElementById('btnLike').classList.toggle('liked',j.liked);
    if(a==='fav')document.getElementById('btnFav').classList.toggle('on',j.faved);
    toast(j.liked?'已点赞':a==='like'?'已取消点赞':'成功');
  }).catch(e=>toast(e.message));
}

// ---------- danmaku ----------
function connectDanmu(wid){
  if(es)es.close();
  es=new EventSource('/api/danmu/stream');
  es.onmessage=ev=>{try{const d=JSON.parse(ev.data);if(d.type==='danmu'&&d.data.workId===wid)spawnDanmu(d.data);}catch(e){}};
  api('/api/danmu/'+wid).then(list=>list.forEach(spawnDanmu));
}
function spawnDanmu(d){
  const layer=document.getElementById('danmuLayer');if(!layer)return;
  const el=document.createElement('div');el.className='danmu-item'+(d.color==='rainbow'?' rainbow-text':'');
  if(d.color!=='rainbow'&&d.color!=='white')el.style.color=d.color;
  if(d.color==='white')el.style.color='#fff';
  el.innerHTML=`${d.avatar?`<img src="${d.avatar}">`:''}<span>${esc(d.userName)}: ${esc(d.text)}</span>`;
  el.style.top=(5+Math.random()*80)+'%';
  el.style.right='-40%';
  layer.appendChild(el);
  const dur=9000+Math.random()*4000;
  const start=performance.now();
  function tick(now){
    const p=(now-start)/dur;
    if(p>=1){el.remove();return;}
    el.style.transform=`translateX(${-p*140}vw)`;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function sendDanmu(){
  const inp=document.getElementById('dmInput');const text=inp.value.trim();if(!text)return;
  api('/api/danmu',{method:'POST',body:JSON.stringify({workId:curWork.id,text,color:selColor})}).then(()=>{inp.value='';refreshMe();}).catch(e=>toast(e.message));
}

// ---------- comments ----------
function loadComments(wid){
  api('/api/comments/'+wid).then(list=>{
    document.getElementById('cmtCount').textContent=list.length;
    const tops=list.filter(c=>!c.parentId);
    document.getElementById('cmtList').innerHTML=tops.length?tops.map(c=>cmtHtml(c,list)).join(''):'<div class="empty">还没有评论，来抢沙发</div>';
  });
}
function cmtHtml(c,list){
  const reps=list.filter(x=>x.parentId===c.id);
  return `<div class="cmt">
    <div class="avatar" style="width:34px;height:34px">${c.avatar?`<img src="${c.avatar}">`:esc(c.userName[0])}</div>
    <div class="body">
      <div class="name">${esc(c.userName)} · LV?</div>
      <div class="txt">${esc(c.text)}</div>
      <div class="foot"><span onclick="likeCmt(${c.id},this)">❤️ ${(c.likes||[]).length}</span><span onclick="toggleReply(${c.id})">回复</span></div>
      <div class="reply-box" id="rb-${c.id}" style="display:none"><input placeholder="回复 @${esc(c.userName)}" onkeydown="if(event.key==='Enter')sendComment(${c.id},this)"></div>
      <div class="replies">${reps.map(r=>`
        <div class="cmt" style="border:none;padding:6px 0">
          <div class="avatar" style="width:28px;height:28px">${r.avatar?`<img src="${r.avatar}">`:esc(r.userName[0])}</div>
          <div class="body"><div class="name">${esc(r.userName)}</div><div class="txt">${esc(r.text)}</div>
          <div class="foot"><span onclick="likeCmt(${r.id},this)">❤️ ${(r.likes||[]).length}</span></div></div>
        </div>`).join('')}</div>
    </div></div>`;
}
function toggleReply(id){const b=document.getElementById('rb-'+id);b.style.display=b.style.display==='none'?'block':'none';}
function likeCmt(id,el){if(!me)return openLogin(false);api(`/api/comments/${id}/like`,{method:'POST'}).then(j=>{el.innerHTML='❤️ '+j.count;}).catch(e=>toast(e.message));}
function sendComment(parentId,inputEl){
  const inp=inputEl||document.getElementById('cmtInput');
  const text=inp.value.trim();if(!text)return;
  api('/api/comments',{method:'POST',body:JSON.stringify({workId:curWork.id,text,parentId})}).then(()=>{loadComments(curWork.id);refreshMe();}).catch(e=>toast(e.message));
}

// ---------- profile / history ----------
function openProfile(){
  if(!me)return openLogin(false);
  go('profile');
  Promise.all([api('/api/my/works'),api('/api/my/history')]).then(([works,hist])=>{
    document.getElementById('page-profile').innerHTML=`
      <div style="display:flex;gap:16px;align-items:center;background:#fff;padding:20px;border-radius:12px;margin-bottom:16px">
        <div class="avatar" style="width:64px;height:64px;font-size:24px">${me.avatar?`<img src="${me.avatar}">`:esc(me.name[0])}</div>
        <div><h2>${esc(me.name)}</h2><div style="color:var(--sub)">等级 LV${me.level}/1000 · 经验 ${me.exp}</div></div>
        <div style="margin-left:auto"><label class="btn btn-ghost" style="cursor:pointer">上传头像<input type="file" hidden accept="image/*" onchange="uploadAvatar(this)"></label></div>
      </div>
      <div class="tabs"><span class="active">我的作品</span></div>
      <div class="grid">${works.length?works.map(card).join(''):'<div class="empty">还没发布作品</div>'}</div>`;
  });
}
function uploadAvatar(inp){
  const fd=new FormData();fd.append('file',inp.files[0]);
  fetch('/api/upload/avatar',{method:'POST',headers:token?{Authorization:'Bearer '+token}:{}},body:fd).then(r=>r.json()).then(j=>{if(j.url){toast('头像已更新');refreshMe();openProfile();}});
}
function openHistory(){
  if(!me)return openLogin(false);
  go('profile');
  api('/api/my/history').then(list=>{
    document.getElementById('page-profile').innerHTML=`
      <div class="tabs"><span class="active">观看历史</span></div>
      <div class="grid">${list.length?list.map(card).join(''):'<div class="empty">暂无观看历史</div>'}</div>`;
  });
}

// ---------- admin ----------
function openAdmin(){
  if(!me||!me.isAdmin)return toast('仅管理员可用');
  go('admin');renderAdmin();
}
function renderAdmin(){
  Promise.all([api('/api/admin/users'),api('/api/admin/danmu'),api('/api/admin/comments'),api('/api/admin/works')]).then(([users,danmus,comments,works])=>{
    document.getElementById('page-admin').innerHTML=`
      <h2 style="margin:10px 0">管理后台</h2>
      <h3 style="margin:14px 0 6px">用户（升降级）</h3>
      <table><tr><th>ID</th><th>用户名</th><th>等级</th><th>经验</th><th>操作</th></tr>
      ${users.map(u=>`<tr><td>${u.id}</td><td>${esc(u.name)}${u.isAdmin?' 👑':''}</td><td>LV${u.level}</td><td>${u.exp||0}</td>
        <td><button class="mini" onclick="setLv(${u.id},${u.level+1})">升1级</button> <button class="mini" onclick="setLv(${u.id},${u.level-1})">降1级</button></td></tr>`).join('')}</table>
      <h3 style="margin:18px 0 6px">弹幕（${danmus.length}）</h3>
      <table><tr><th>ID</th><th>用户</th><th>内容</th><th>操作</th></tr>
      ${danmus.slice(0,50).map(d=>`<tr><td>${d.id}</td><td>${esc(d.userName)}</td><td>${esc(d.text)}</td><td><button class="mini danger" onclick="delDm(${d.id})">删除</button></td></tr>`).join('')}</table>
      <h3 style="margin:18px 0 6px">作品（${works.length}）</h3>
      <table><tr><th>ID</th><th>标题</th><th>作者</th><th>播放</th><th>操作</th></tr>
      ${works.map(w=>`<tr><td>${w.id}</td><td>${esc(w.title)}</td><td>${esc(w.authorName)}</td><td>${w.playCount}</td><td><button class="mini danger" onclick="delWork(${w.id})">删除</button></td></tr>`).join('')}</table>`;
  }).catch(e=>toast(e.message));
}
function setLv(id,lv){api(`/api/admin/users/${id}/level`,{method:'POST',body:JSON.stringify({level:lv})}).then(()=>{toast('等级已改');renderAdmin();refreshMe();}).catch(e=>toast(e.message));}
function delDm(id){api('/api/admin/danmu/'+id,{method:'DELETE'}).then(()=>{toast('已删');renderAdmin();});}
function delWork(id){api('/api/admin/works/'+id,{method:'DELETE'}).then(()=>{toast('已删');renderAdmin();});}

// ---------- modal ----------
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('mask').classList.add('show');}
function closeModal(){document.getElementById('mask').classList.remove('show');}
document.getElementById('mask').onclick=e=>{if(e.target.id==='mask')closeModal();};

// boot
refreshMe().then(loadHome);
</script>
