<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鸽子视频观看站</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pink:#FB7299;--blue:#00AEEC}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f6f7f8;color:#18191c}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;font-family:inherit}
input,textarea,select{font-family:inherit;outline:none}
.nav{position:sticky;top:0;z-index:100;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;align-items:center;padding:0 24px;height:56px;gap:16px}
.logo{font-size:22px;font-weight:900;color:var(--pink);cursor:pointer;white-space:nowrap}
.nav .search{flex:1;max-width:360px;display:flex;background:#f1f2f3;border-radius:8px;overflow:hidden}
.nav .search input{flex:1;border:none;background:transparent;padding:8px 12px;font-size:14px}
.nav .search button{background:transparent;padding:0 14px;color:#61666d}
.nav .right{display:flex;align-items:center;gap:12px;margin-left:auto}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.btn{padding:7px 16px;border-radius:8px;font-size:14px}
.btn-pink{background:var(--pink);color:#fff}
.btn-ghost{background:#f1f2f3}
.upload-btn{background:var(--pink);color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px;display:flex;align-items:center;justify-content:center}
.cats{background:#fff;display:flex;gap:20px;padding:0 24px;height:42px;align-items:center;overflow-x:auto;border-bottom:1px solid #f1f2f3}
.cats span{white-space:nowrap;color:#61666d;font-size:14px;cursor:pointer;padding:4px 0}
.cats span.active{color:var(--pink);font-weight:700}
.banner{margin:16px 24px;border-radius:12px;background:linear-gradient(120deg,#FB7299,#00AEEC);color:#fff;padding:32px}
.banner h1{font-size:30px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding:16px 24px}
.card{background:#fff;border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card .thumb{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.card .thumb img,.card .thumb video{width:100%;height:100%;object-fit:cover}
.card .thumb .playico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px}
.card .stats{position:absolute;left:6px;bottom:6px;right:6px;display:flex;justify-content:space-between;color:#fff;font-size:12px;text-shadow:0 1px 2px #000}
.card .body{padding:8px 10px}
.card .title{font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12px;color:#61666d;margin-top:4px}
.tag-type{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:#e3f2fd;color:var(--blue);margin-right:4px}
.page{max-width:1000px;margin:16px auto;padding:0 16px;display:none}
.page.show{display:block}
.player-wrap{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9}
.player-wrap video{width:100%;height:100%;object-fit:contain}
.danmu-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.danmu-item{position:absolute;white-space:nowrap;font-size:20px;text-shadow:0 1px 2px #000;display:flex;align-items:center;gap:6px;will-change:transform}
.danmu-item img{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1px solid #fff}
.rainbow-text{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rain 3s linear infinite}
@keyframes rain{to{background-position:200% center}}
.post-view{background:#fff;border-radius:12px;padding:30px;min-height:200px}
.post-view h1{font-size:24px;margin-bottom:16px}
.post-view .text{font-size:16px;line-height:1.8;white-space:pre-wrap}
.post-view img{max-width:100%;border-radius:8px;margin-top:12px}
.info-row{display:flex;align-items:center;gap:14px;background:#fff;border-radius:12px;padding:14px 18px;margin-top:14px;flex-wrap:wrap}
.act-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:18px;background:#f1f2f3;font-size:14px;color:#61666d}
.danmu-bar{background:#fff;border-radius:12px;padding:12px 16px;margin-top:12px}
.danmu-bar input{width:100%;border:1px solid #e3e5e7;border-radius:8px;padding:9px 12px;font-size:14px;margin-bottom:8px}
.colors{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.swatch.sel{border-color:#000}
.swatch.locked{opacity:.4;cursor:not-allowed}
.comments{background:#fff;border-radius:12px;padding:18px;margin-top:14px}
.cmt-input{display:flex;gap:10px;margin-bottom:18px}
.cmt-input input{flex:1;border:1px solid #e3e5e7;border-radius:8px;padding:9px 12px}
.cmt{display:flex;gap:10px;padding:12px 0;border-top:1px solid #f1f2f3}
.cmt .body{flex:1}
.cmt .name{font-size:13px;color:#61666d}
.cmt .txt{font-size:15px;margin:4px 0}
.cmt .foot{font-size:12px;color:#61666d;display:flex;gap:14px}
.cmt .foot span{cursor:pointer}
.replies{margin-left:36px;border-left:2px solid #f1f2f3;padding-left:12px}
.reply-box input{width:100%;border:1px solid #e3e5e7;border-radius:6px;padding:6px 10px;font-size:13px;margin:4px 0}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center}
.mask.show{display:flex}
.modal{background:#fff;border-radius:14px;width:480px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:24px}
.modal h2{margin-bottom:16px}
.modal label{display:block;font-size:13px;color:#61666d;margin:10px 0 4px}
.modal input,.modal textarea,.modal select{width:100%;border:1px solid #e3e5e7;border-radius:8px;padding:9px 12px;font-size:14px}
.modal textarea{min-height:80px;resize:vertical}
.typepick{display:flex;gap:10px;margin-bottom:10px}
.typepick div{flex:1;border:2px solid #e3e5e7;border-radius:10px;padding:16px;text-align:center;cursor:pointer}
.typepick div.sel{border-color:var(--pink);background:#fff0f5}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #f1f2f3;font-size:14px}
th{background:#fafbfc;color:#61666d}
.mini{padding:3px 10px;border-radius:6px;font-size:12px;background:#f1f2f3;cursor:pointer}
.mini.danger{background:#ffeef3;color:var(--pink)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:8px;z-index:300;display:none;font-size:14px}
.empty{text-align:center;color:#61666d;padding:40px}
.chat-layout{display:grid;grid-template-columns:260px 1fr;background:#fff;border-radius:12px;overflow:hidden;height:600px}
.chat-list{border-right:1px solid #f1f2f3;overflow-y:auto}
.chat-list .item{padding:12px 16px;cursor:pointer;display:flex;gap:10px;align-items:center}
.chat-list .item:hover,.chat-list .item.active{background:#f6f7f8}
.chat-win{display:flex;flex-direction:column}
.chat-msgs{flex:1;overflow-y:auto;padding:16px}
.chat-msg{margin-bottom:12px;display:flex;gap:8px}
.chat-msg.me{flex-direction:row-reverse}
.chat-bubble{max-width:60%;padding:8px 12px;border-radius:12px;background:#f1f2f3;font-size:14px}
.chat-msg.me .chat-bubble{background:var(--pink);color:#fff}
.chat-bubble img{max-width:200px;border-radius:8px;display:block}
.chat-input{padding:12px;border-top:1px solid #f1f2f3;display:flex;gap:8px}
.chat-input input{flex:1;border:1px solid #e3e5e7;border-radius:8px;padding:8px 12px}
.notif-item{padding:12px 16px;background:#fff;border-radius:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center;cursor:pointer}
.notif-item.unread{background:#fff0f5}
.tabs2{display:flex;gap:18px;border-bottom:1px solid #e3e5e7;margin-bottom:16px}
.tabs2 span{padding:10px 4px;cursor:pointer;color:#61666d}
.tabs2 span.active{color:var(--pink);border-bottom:2px solid var(--pink);font-weight:700}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}.chat-layout{grid-template-columns:1fr;height:70vh}}
</style>
</head>
<body>
<div class="nav">
  <div class="logo" onclick="go('home')">鸽子视频</div>
  <div class="search"><input id="searchInput" placeholder="搜索"><button onclick="doSearch()">搜索</button></div>
  <div class="right">
    <button class="upload-btn" onclick="openUpload()">+</button>
    <div id="navUser"></div>
  </div>
</div>
<div class="cats" id="cats"></div>

<div class="page show" id="page-home">
  <div class="banner"><h1>鸽子视频观看站</h1><p>看视频、发弹幕、交鸽子朋友</p></div>
  <div class="grid" id="homeGrid"></div>
</div>
<div class="page" id="page-detail"></div>
<div class="page" id="page-profile"></div>
<div class="page" id="page-admin"></div>
<div class="page" id="page-messages"></div>

<div class="mask" id="mask"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
const ENC_KEY="V2pKb2QxZ3hiM2hYUld4S1lsVnNlRlJGYkV0aE1VcEZZVWR3TTJSSVFsQlZNRVpUWWxWS2VGVXdhSGhrUkVKeVpWWndWMVozUFQwPQ==";
const GH_USER="15319404625",GH_REPO="xi-danmu",GH_BRANCH="main";
const TOKEN=atob(atob(atob(ENC_KEY)));
const DATA_FILES={users:'data/users.json',works:'data/works.json',danmu:'data/danmaku.json',comments:'data/comments.json',follows:'data/follows.json',messages:'data/messages.json',history:'data/history.json',notifs:'data/notifs.json'};
const CATS=[['all','全部'],['animation','动画'],['bangumi','番剧'],['game','游戏'],['knowledge','知识'],['tech','科技'],['music','音乐'],['dance','舞蹈'],['film','影视'],['life','生活'],['guichu','鬼畜'],['fashion','时尚'],['ent','娱乐'],['sports','运动']];
const COLORS=[['white','#fff','默认白'],['red','#f00','红'],['yellow','#ff0','黄'],['blue','#0080ff','蓝'],['green','#0c0','绿'],['cyan','#0ff','青'],['purple','#a0f','紫'],['rainbow','rainbow','渐变(LV3+)']];

let DB={}, me=null, activeCat='all', curWork=null, selColor='white', curChatWith=null, msgTab='notif';
let cacheBust=0;

function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2200);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('show'));document.getElementById('page-'+p).classList.add('show');window.scrollTo(0,0);}

async function ghRead(path){
  try{const r=await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${path}?t=${cacheBust++}`,{headers:{Authorization:'token '+TOKEN}});if(!r.ok)return null;const j=await r.json();return JSON.parse(decodeURIComponent(escape(atob(j.content))));}catch(e){return null;}
}
async function ghWrite(path,obj,msg){
  let sha=null;
  try{const r=await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${path}`,{headers:{Authorization:'token '+TOKEN}});if(r.ok)sha=(await r.json()).sha;}catch(e){}
  const body=JSON.stringify(obj);
  const res=await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${path}`,{method:'PUT',headers:{Authorization:'token '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({message:msg,content:btoa(unescape(encodeURIComponent(body))),branch:GH_BRANCH,...(sha?{sha}:{})})});
  if(!res.ok)throw new Error('保存失败 '+res.status);
}
async function ghUploadFile(filename,dataUri){
  const [meta,b64]=dataUri.split(',');
  const br=await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/git/blobs`,{method:'POST',headers:{Authorization:'token '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({content:b64,encoding:'base64'})});
  const blobSha=(await br.json()).sha;
  const tr=await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/git/trees/${GH_BRANCH}`,{headers:{Authorization:'token '+TOKEN}});
  const treeSha=(await tr.json()).sha;
  const nr2=await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/git/trees`,{method:'POST',headers:{Authorization:'token '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({base_tree:treeSha,tree:[{path:'uploads/'+filename,mode:'100644',type:'blob',sha:blobSha}]})});
  const newTreeSha=(await nr2.json()).sha;
  const cr=await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/git/commits`,{method:'POST',headers:{Authorization:'token '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({message:'upload '+filename,tree:newTreeSha,parents:[treeSha]})});
  const commitSha=(await cr.json()).sha;
  await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/git/refs/heads/${GH_BRANCH}`,{method:'PATCH',headers:{Authorization:'token '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sha:commitSha})});
  return `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/${GH_BRANCH}/uploads/${filename}`;
}
function hashPw(p){let h=2166136261;for(let i=0;i<p.length;i++){h^=p.charCodeAt(i);h=Math.imul(h,16777615);}return 'x'+h;}
function expForLevel(L){return L*(L+1)*5;}
function addExp(name,amt){const u=DB.users.find(x=>x.name===name);if(!u)return;u.exp=(u.exp||0)+amt;let l=0;while(l<1000&&u.exp>=expForLevel(l+1))l++;u.level=l;}
function nextId(){return Date.now()+Math.floor(Math.random()*1000);}
async function loadDB(){
  const keys=Object.keys(DATA_FILES);
  const arr=await Promise.all(keys.map(k=>ghRead(DATA_FILES[k])));
  keys.forEach((k,i)=>DB[k]=arr[i]||[]);
  if(!DB.works.find(w=>w.title==='欢迎来到我自制的网站'))DB.works.unshift({id:nextId(),type:'post',title:'欢迎来到我自制的网站',content:'欢迎来到我自制的网站，欢迎大家使用',images:[],category:'life',author:'管理员账号',authorId:1,playCount:0,likes:[],coins:[],createdAt:Date.now()});
}

function renderNav(){
  const el=document.getElementById('navUser');
  if(me){
    const unread=DB.notifs.filter(n=>n.to===me.name&&!n.read).length+DB.messages.filter(m=>m.to===me.name&&!m.read).length;
    el.innerHTML=`<div style="position:relative"><div class="avatar" onclick="openMenu()">${me.avatar?`<img src="${me.avatar}">`:esc(me.name[0])}</div>${unread?`<div class="badge">${unread}</div>`:''}</div>`;
  } else {
    el.innerHTML=`<button class="btn btn-ghost" onclick="openLogin(false)">登录</button><button class="btn btn-pink" onclick="openLogin(true)">注册</button>`;
  }
}
function openMenu(){
  const items=[['我的主页',()=>openProfile()],['消息/私信',()=>openMessages()],['观看历史',()=>openHistory()]];
  if(me.isAdmin)items.push(['管理后台',()=>openAdmin()]);
  items.push(['退出登录',()=>{localStorage.removeItem('xi_user');me=null;renderNav();go('home');loadHome();}]);
  openModal(`<h2>${esc(me.name)} · LV${me.level}</h2>`+items.map(([t,f],i)=>`<div style="padding:12px;border-bottom:1px solid #f1f2f3;cursor:pointer" onclick="closeModal();_m[${i}]()">${t}</div>`).join(''));
  window._m=items.map(x=>x[1]);
}
function openLogin(isReg){
  openModal(`<h2>${isReg?'注册':'登录'}</h2><label>用户名</label><input id="auName"><label>密码</label><input id="auPass" type="password"><div class="actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-pink" onclick="doLogin(${isReg})">${isReg?'注册':'登录'}</button></div>`);
}
async function doLogin(isReg){
  const name=document.getElementById('auName').value.trim(),pass=document.getElementById('auPass').value;
  if(!name||!pass)return toast('请填写完整');
  if(isReg){
    let finalName=name;
    while(DB.users.find(u=>u.name===finalName)){finalName=name+Math.floor(Math.random()*900+100);}
    if(finalName!==name)toast('用户名已存在，已自动改为 '+finalName);
    DB.users.push({id:nextId(),name:finalName,pass:hashPw(pass),avatar:'',level:0,exp:0,isAdmin:false});
    await ghWrite('data/users.json',DB.users,'注册 '+finalName);
    localStorage.setItem('xi_user',finalName);me=DB.users.find(u=>u.name===finalName);
  } else {
    const u=DB.users.find(x=>x.name===name);
    if(!u||u.pass!==hashPw(pass))return toast('用户名或密码错误');
    localStorage.setItem('xi_user',name);me=u;
  }
  renderNav();closeModal();toast(isReg?'注册成功，已自动登录':'登录成功');loadHome();
}

function loadCats(){document.getElementById('cats').innerHTML=CATS.map(([v,n])=>`<span class="${v===activeCat?'active':''}" onclick="activeCat='${v}';loadCats();loadHome()">${n}</span>`).join('');}
function workCard(w){
  const dmN=DB.danmu.filter(d=>d.workId===w.id).length,cmN=DB.comments.filter(c=>c.workId===w.id).length;
  const thumb=w.type==='video'?(w.cover?`<img src="${w.cover}">`:(w.video?`<video src="${w.video}" muted></video>`:`<div class="playico">▶</div>`)):((w.images||[]).length?`<img src="${w.images[0]}">`:`<div class="playico" style="font-size:24px">文</div>`);
  return `<div class="card" onclick="openWork(${w.id})"><div class="thumb">${thumb}<div class="stats"><span>▶ ${w.playCount||0}</span><span>💬 ${dmN}</span></div></div><div class="body"><div class="title"><span class="tag-type">${w.type==='video'?'视频':'图文'}</span>${esc(w.title)}</div><div class="meta">${esc(w.author)} · ${(w.likes||[]).length}赞 · ${cmN}评</div></div></div>`;
}
async function loadHome(){loadCats();let list=[...DB.works].sort((a,b)=>b.createdAt-a.createdAt);if(activeCat!=='all')list=list.filter(w=>w.category===activeCat);document.getElementById('homeGrid').innerHTML=list.length?list.map(workCard).join(''):'<div class="empty">暂无内容</div>';}
function doSearch(){toast('搜索：'+document.getElementById('searchInput').value);}

function openUpload(){
  if(!me)return openLogin(false);
  openModal(`<h2>发布作品</h2><div class="typepick"><div id="tp-video" onclick="pickType('video')"><b>视频投稿</b><br><small>不限大小</small></div><div id="tp-post" onclick="pickType('post')"><b>图文投稿</b><br><small>文字+图片</small></div></div><label>标题</label><input id="upTitle"><label>简介/正文</label><textarea id="upContent"></textarea><label>分区</label><select id="upCat">${CATS.filter(c=>c[0]!=='all').map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select><div id="videoFields"><label>视频文件(不限大小)</label><input type="file" id="upVideo" accept="video/*"><label>或填视频链接</label><input id="upVideoUrl" placeholder="https://..."><label>封面图</label><input type="file" id="upCover" accept="image/*"></div><div id="postFields" style="display:none"><label>图片(可多选)</label><input type="file" id="upImages" accept="image/*" multiple></div><div class="actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-pink" onclick="doUpload()">发布</button></div>`);
  window._utype='video';pickType('video');
}
function pickType(t){window._utype=t;document.getElementById('tp-video').classList.toggle('sel',t==='video');document.getElementById('tp-post').classList.toggle('sel',t==='post');document.getElementById('videoFields').style.display=t==='video'?'block':'none';document.getElementById('postFields').style.display=t==='post'?'block':'none';}
function readFileAsDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});}
async function doUpload(){
  try{
    const title=document.getElementById('upTitle').value.trim();if(!title)return toast('标题必填');
    toast('上传中(大文件较慢)...');
    let video='',cover='',images=[];
    if(window._utype==='video'){
      const vf=document.getElementById('upVideo').files[0];
      if(vf)video=await ghUploadFile(Date.now()+'_'+vf.name,await readFileAsDataURL(vf));else video=document.getElementById('upVideoUrl').value.trim();
      const cf=document.getElementById('upCover').files[0];if(cf)cover=await ghUploadFile(Date.now()+'_c.jpg',await readFileAsDataURL(cf));
    } else {for(const f of document.getElementById('upImages').files)images.push(await ghUploadFile(Date.now()+'_'+f.name,await readFileAsDataURL(f)));}
    DB.works.unshift({id:nextId(),type:window._utype,title,content:document.getElementById('upContent').value,category:document.getElementById('upCat').value,video,cover,images,author:me.name,authorId:me.id,playCount:0,likes:[],coins:[],favs:[],createdAt:Date.now()});
    await ghWrite('data/works.json',DB.works,'发布 '+title);
    addExp(me.name,window._utype==='video'?50:10);await ghWrite('data/users.json',DB.users,'经验');
    closeModal();toast('发布成功！');loadHome();go('home');
  }catch(e){toast('发布失败: '+e.message);}
}

async function openWork(id){
  const w=DB.works.find(x=>x.id===id);if(!w)return;
  w.playCount=(w.playCount||0)+1;
  DB.history=DB.history.filter(h=>!(h.user===me?.name&&h.workId===id));
  DB.history.unshift({user:me?me.name:'游客',workId:id,time:Date.now()});
  curWork=w;renderDetail(w);go('detail');loadDanmu(w.id);loadComments(w.id);
}
function renderDetail(w){
  const player=w.type==='video'
    ?`<div class="player-wrap">${w.video?`<video src="${w.video}" controls autoplay></video>`:'<div style="color:#fff;text-align:center;padding-top:40%">无视频源</div>'}<div class="danmu-layer" id="danmuLayer"></div></div>`
    :`<div class="post-view"><h1>${esc(w.title)}</h1><div class="text">${esc(w.content)}</div>${(w.images||[]).map(i=>`<img src="${i}">`).join('')}</div>`;
  document.getElementById('page-detail').innerHTML=`<div class="detail">${player}
    <div class="info-row"><div class="avatar">${esc(w.author[0])}</div><div><div style="font-weight:700">${esc(w.author)}</div><div style="font-size:12px;color:#61666d">${w.playCount||0}播放</div></div>
    ${me&&me.name!==w.author?`<button class="btn btn-ghost" id="btnFollow" onclick="toggleFollow('${esc(w.author)}')">${isFollowing(w.author)?'已关注':'+ 关注'}</button>`:''}
    <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
      <button class="act-btn" id="btnLike" onclick="act('like')">👍 <span id="cLike">${(w.likes||[]).length}</span></button>
      <button class="act-btn" id="btnCoin" onclick="act('coin')">🪙 <span id="cCoin">${(w.coins||[]).length}</span></button>
      <button class="act-btn" onclick="openChatWith('${esc(w.author)}')">💬 私信</button>
    </div></div>
    ${w.type==='video'?`<div class="danmu-bar"><input id="dmInput" placeholder="发个友善的弹幕" onkeydown="if(event.key==='Enter')sendDanmu()"><div class="colors" id="colorRow"></div></div>`:''}
    <div class="comments"><h3>评论 <span id="cmtCount">${DB.comments.filter(c=>c.workId===w.id).length}</span></h3>
      <div class="cmt-input"><input id="cmtInput" placeholder="发一条友善的评论" onkeydown="if(event.key==='Enter')sendComment(null)"><button class="btn btn-pink" onclick="sendComment(null)">评论</button></div><div id="cmtList"></div></div></div>`;
  renderColors();
}
function renderColors(){document.getElementById('colorRow').innerHTML='<span style="font-size:13px">颜色:</span>'+COLORS.map(([v,hex])=>{const locked=v==='rainbow'&&(!me||me.level<3);return `<div class="swatch ${v===selColor?'sel':''} ${locked?'locked':''}" title="${v}" style="background:${hex==='rainbow'?'linear-gradient(90deg,red,yellow,green,cyan,blue,purple)':hex}" onclick="pickColor('${v}',${locked})"></div>`;}).join('');}
function pickColor(v,locked){if(locked)return toast('渐变需要LV3');selColor=v;renderColors();}
async function act(a){
  if(!me)return openLogin(false);const w=curWork;
  if(a==='like'){const i=w.likes.indexOf(me.name);if(i>=0)w.likes.splice(i,1);else{w.likes.push(me.name);notify(w.author,me.name+' 赞了你的作品《'+w.title+'》',w.id);}}
  if(a==='coin'&&!w.coins.includes(me.name))w.coins.push(me.name);
  await ghWrite('data/works.json',DB.works,'互动');
  document.getElementById('cLike').textContent=w.likes.length;document.getElementById('cCoin').textContent=w.coins.length;
}
function isFollowing(name){return (DB.follows.find(f=>f.follower===me?.name)?.following||[]).includes(name);}
async function toggleFollow(name){
  if(!me)return openLogin(false);
  let f=DB.follows.find(f=>f.follower===me.name);if(!f){f={follower:me.name,following:[]};DB.follows.push(f);}
  const i=f.following.indexOf(name);if(i>=0)f.following.splice(i,1);else{f.following.push(name);notify(name,me.name+' 关注了你',null);}
  await ghWrite('data/follows.json',DB.follows,'关注');await ghWrite('data/notifs.json',DB.notifs,'通知');
  document.getElementById('btnFollow').textContent=f.following.includes(name)?'已关注':'+ 关注';
}
function notify(to,text,workId){if(!to||to===me?.name)return;DB.notifs.push({id:nextId(),to,text,workId:workId||null,from:me?me.name:'系统',read:false,time:Date.now()});}

function loadDanmu(wid){const layer=document.getElementById('danmuLayer');if(!layer)return;layer.innerHTML='';DB.danmu.filter(d=>d.workId===wid).forEach(spawnDanmu);}
function spawnDanmu(d){
  const layer=document.getElementById('danmuLayer');if(!layer)return;
  const el=document.createElement('div');el.className='danmu-item'+(d.color==='rainbow'?' rainbow-text':'');
  if(d.color!=='rainbow'&&d.color!=='white')el.style.color=d.color;
  el.innerHTML=`${d.avatar?`<img src="${d.avatar}">`:''}<span>${esc(d.user)}: ${esc(d.text)}</span>`;
  el.style.top=(5+Math.random()*80)+'%';el.style.right='-40%';layer.appendChild(el);
  const dur=9000+Math.random()*4000,start=performance.now();
  (function tick(now){const p=(now-start)/dur;if(p>=1)return el.remove();el.style.transform=`translateX(${-p*140}vw)`;requestAnimationFrame(tick);})(start);
}
async function sendDanmu(){
  try{
    const inp=document.getElementById('dmInput');const text=inp.value.trim();if(!text)return;
    if(!me)return openLogin(false);
    if(selColor==='rainbow'&&(!me||me.level<3))return toast('渐变需要LV3');
    DB.danmu.push({id:nextId(),workId:curWork.id,user:me.name,avatar:me.avatar||'',text,color:selColor,time:Date.now()});
    await ghWrite('data/danmaku.json',DB.danmu,'弹幕');
    addExp(me.name,2);await ghWrite('data/users.json',DB.users,'经验');
    inp.value='';loadDanmu(curWork.id);toast('弹幕已发送');
  }catch(e){toast('发送失败: '+e.message);}
}

function loadComments(wid){
  const list=DB.comments.filter(c=>c.workId===wid);
  document.getElementById('cmtCount').textContent=list.length;
  const tops=list.filter(c=>!c.parentId);
  document.getElementById('cmtList').innerHTML=tops.length?tops.map(c=>cmtHtml(c,list)).join(''):'<div class="empty">还没有评论</div>';
}
function cmtHtml(c,list){
  const reps=list.filter(x=>x.parentId===c.id);
  return `<div class="cmt"><div class="avatar" style="width:34px;height:34px">${c.avatar?`<img src="${c.avatar}">`:esc(c.user[0])}</div><div class="body"><div class="name">${esc(c.user)}</div><div class="txt">${esc(c.text)}</div><div class="foot"><span onclick="likeCmt(${c.id})">❤️ ${(c.likes||[]).length}</span><span onclick="var b=document.getElementById('rb-${c.id}');b.style.display=b.style.display==='none'?'block':'none'">回复</span></div><div class="reply-box" id="rb-${c.id}" style="display:none"><input placeholder="回复" onkeydown="if(event.key==='Enter')sendComment(${c.id},this)"></div><div class="replies">${reps.map(r=>`<div class="cmt" style="border:none;padding:6px 0"><div class="avatar" style="width:28px;height:28px">${r.avatar?`<img src="${r.avatar}">`:esc(r.user[0])}</div><div class="body"><div class="name">${esc(r.user)}</div><div class="txt">${esc(r.text)}</div><div class="foot"><span onclick="likeCmt(${r.id})">❤️ ${(r.likes||[]).length}</span><span onclick="var b=document.getElementById('rb-${r.id}');b.style.display=b.style.display==='none'?'block':'none'">回复</span></div><div class="reply-box" id="rb-${r.id}" style="display:none"><input placeholder="回复" onkeydown="if(event.key==='Enter')sendComment(${r.id},this)"></div></div></div>`).join('')}</div></div></div>`;
}
async function sendComment(parentId,inputEl){
  try{
    if(!me)return openLogin(false);
    const inp=inputEl||document.getElementById('cmtInput');const text=inp.value.trim();if(!text)return;
    const c={id:nextId(),workId:curWork.id,parentId:parentId||null,user:me.name,avatar:me.avatar||'',text,likes:[],time:Date.now()};
    DB.comments.push(c);
    if(parentId){const parent=DB.comments.find(x=>x.id===parentId);if(parent)notify(parent.user,me.name+' 回复了你的评论: '+text,curWork.id);}
    else notify(curWork.author,me.name+' 评论了你的作品《'+curWork.title+'》',curWork.id);
    await ghWrite('data/comments.json',DB.comments,'评论');await ghWrite('data/notifs.json',DB.notifs,'通知');
    addExp(me.name,3);await ghWrite('data/users.json',DB.users,'经验');
    inp.value='';loadComments(curWork.id);toast('评论成功');
  }catch(e){toast('评论失败: '+e.message);}
}
async function likeCmt(id){
  if(!me)return openLogin(false);
  const c=DB.comments.find(x=>x.id===id);if(!c)return;
  c.likes=c.likes||[];const i=c.likes.indexOf(me.name);
  if(i>=0)c.likes.splice(i,1);else{c.likes.push(me.name);notify(c.user,me.name+' 赞了你的评论',c.workId);}
  await ghWrite('data/comments.json',DB.comments,'赞评论');await ghWrite('data/notifs.json',DB.notifs,'通知');
  loadComments(curWork.id);
}

function openMessages(){if(!me)return openLogin(false);go('messages');renderMessages();}
function renderMessages(){
  const myNotifs=DB.notifs.filter(n=>n.to===me.name).sort((a,b)=>b.time-a.time);
  const peers=[...new Set(DB.messages.filter(m=>m.from===me.name||m.to===me.name).flatMap(m=>[m.from,m.to]))].filter(p=>p&&p!==me.name);
  document.getElementById('page-messages').innerHTML=`<h2 style="margin:10px 0">消息中心</h2>
    <div class="tabs2"><span class="${msgTab==='notif'?'active':''}" onclick="msgTab='notif';renderMessages()">通知</span><span class="${msgTab==='chat'?'active':''}" onclick="msgTab='chat';renderMessages()">私信</span></div>
    ${msgTab==='notif'?`<div>${myNotifs.length?myNotifs.map(n=>`<div class="notif-item ${n.read?'':'unread'}" onclick="openNotif(${n.id})"><div class="avatar">${esc(n.from[0])}</div><div><div>${esc(n.text)}</div><div style="font-size:12px;color:#61666d">${new Date(n.time).toLocaleString()}</div></div></div>`).join(''):'<div class="empty">暂无通知</div>'}</div>`
    :`<div class="chat-layout"><div class="chat-list">${peers.length?peers.map(p=>`<div class="item" onclick="openChat('${esc(p)}')"><div class="avatar">${esc(p[0])}</div><div style="font-weight:600">${esc(p)}</div></div>`).join(''):'<div class="empty">还没有会话</div>'}</div><div class="chat-win" id="chatWin"><div class="empty">选一个人开始聊天</div></div></div>`}`;
}
async function openNotif(id){
  const n=DB.notifs.find(x=>x.id===id);if(!n)return;
  n.read=true;await ghWrite('data/notifs.json',DB.notifs,'已读');
  if(n.workId)openWork(n.workId);else renderMessages();
}
function openChat(withWho){curChatWith=withWho;renderMessages();
  const msgs=DB.messages.filter(m=>(m.from===me.name&&m.to===withWho)||(m.from===withWho&&m.to===me.name)).sort((a,b)=>a.time-b.time);
  document.getElementById('chatWin').innerHTML=`<div style="padding:12px 16px;border-bottom:1px solid #f1f2f3;font-weight:700">${esc(withWho)}</div><div class="chat-msgs" id="chatMsgs">${msgs.map(m=>`<div class="chat-msg ${m.from===me.name?'me':''}"><div class="avatar" style="width:30px;height:30px">${esc(m.from[0])}</div><div class="chat-bubble">${m.image?`<img src="${m.image}">`:esc(m.text)}</div></div>`).join('')}</div><div class="chat-input"><input id="chatInput" placeholder="输入..." onkeydown="if(event.key==='Enter')sendChat()"><button class="btn btn-ghost" onclick="document.getElementById('chatFile').click()">图</button><input type="file" id="chatFile" accept="image/*" hidden onchange="sendChatImage(this)"><button class="btn btn-pink" onclick="sendChat()">发送</button></div>`;
  document.getElementById('chatMsgs').scrollTop=99999;
}
function openChatWith(name){openMessages();msgTab='chat';openChat(name);}
async function sendChat(){
  const inp=document.getElementById('chatInput');const text=inp.value.trim();if(!text)return;
  DB.messages.push({id:nextId(),from:me.name,to:curChatWith,text,image:'',read:false,time:Date.now()});
  await ghWrite('data/messages.json',DB.messages,'私信');openChat(curChatWith);
}
async function sendChatImage(inp){
  const f=inp.files[0];if(!f)return;toast('上传图片...');
  const url=await ghUploadFile(Date.now()+'_c.jpg',await readFileAsDataURL(f));
  DB.messages.push({id:nextId(),from:me.name,to:curChatWith,text:'',image:url,read:false,time:Date.now()});
  await ghWrite('data/messages.json',DB.messages,'私信图');openChat(curChatWith);
}

function openProfile(){if(!me)return openLogin(false);go('profile');
  document.getElementById('page-profile').innerHTML=`<div style="display:flex;gap:16px;align-items:center;background:#fff;padding:20px;border-radius:12px;margin-bottom:16px"><div class="avatar" style="width:64px;height:64px;font-size:24px">${me.avatar?`<img src="${me.avatar}">`:esc(me.name[0])}</div><div><h2>${esc(me.name)}</h2><div style="color:#61666d">LV${me.level}/1000 · 经验${me.exp}</div></div><div style="margin-left:auto"><label class="btn btn-ghost" style="cursor:pointer">头像<input type="file" hidden accept="image/*" onchange="upAvatar(this)"></label></div></div><h3>我的作品</h3><div class="grid">${DB.works.filter(w=>w.author===me.name).map(workCard).join('')||'<div class="empty">还没发布</div>'}</div>`;
}
async function upAvatar(inp){
  const f=inp.files[0];if(!f)return;toast('上传中...');
  me.avatar=await ghUploadFile(Date.now()+'_a.jpg',await readFileAsDataURL(f));
  await ghWrite('data/users.json',DB.users,'头像');toast('已更新');openProfile();renderNav();
}
function openHistory(){if(!me)return openLogin(false);go('profile');
  const list=DB.history.filter(h=>h.user===me.name).map(h=>DB.works.find(w=>w.id===h.workId)).filter(Boolean);
  document.getElementById('page-profile').innerHTML=`<h2 style="margin:10px 0">观看历史</h2><div class="grid">${list.length?list.map(workCard).join(''):'<div class="empty">暂无</div>'}</div>`;
}

async function openAdmin(){
  if(!me||!me.isAdmin)return toast('仅管理员');go('admin');
  renderAdmin('');
}
function renderAdmin(kw){
  kw=(kw||'').toLowerCase();
  const users=DB.users.filter(u=>!kw||u.name.toLowerCase().includes(kw));
  document.getElementById('page-admin').innerHTML=`<h2 style="margin:10px 0">管理后台</h2>
    <h3>用户</h3>
    <input id="adminSearch" placeholder="搜索用户名..." value="${esc(kw)}" oninput="renderAdmin(this.value)" style="width:100%;padding:8px 12px;border:1px solid #e3e5e7;border-radius:8px;margin-bottom:10px">
    <table><tr><th>用户</th><th>等级</th><th>经验</th><th>操作</th></tr>${users.map(u=>`<tr><td>${esc(u.name)}${u.isAdmin?' 👑':''}</td><td>LV${u.level}</td><td>${u.exp||0}</td><td><button class="mini" onclick="setLv(${u.id},${u.level+1})">升一级</button> <button class="mini" onclick="setLv(${u.id},${u.level-1})">降一级</button> <button class="mini" onclick="setLv(${u.id},${parseInt(prompt('设置等级(0-1000):',u.level))||0})">设等级</button></td></tr>`).join('')}</table>
    <h3 style="margin-top:16px">弹幕</h3><table><tr><th>用户</th><th>内容</th><th>操作</th></tr>${DB.danmu.map(d=>`<tr><td>${esc(d.user)}</td><td>${esc(d.text)}</td><td><button class="mini danger" onclick="delDm(${d.id})">删</button></td></tr>`).join('')}</table>`;
}
async function setLv(id,lv){const u=DB.users.find(x=>x.id===id);u.level=Math.max(0,Math.min(1000,lv));await ghWrite('data/users.json',DB.users,'调等级');renderAdmin(document.getElementById('adminSearch')?.value||'');toast('已调整为LV'+u.level);}
async function delDm(id){DB.danmu=DB.danmu.filter(d=>d.id!==id);await ghWrite('data/danmaku.json',DB.danmu,'删弹幕');renderAdmin(document.getElementById('adminSearch')?.value||'');}

function openModal(h){document.getElementById('modalBox').innerHTML=h;document.getElementById('mask').classList.add('show');}
function closeModal(){document.getElementById('mask').classList.remove('show');}
document.getElementById('mask').onclick=e=>{if(e.target.id==='mask')closeModal();};

(async()=>{await loadDB();const n=localStorage.getItem('xi_user');me=n?DB.users.find(u=>u.name===n):null;renderNav();loadHome();})();
</script>
</body>
</html>
